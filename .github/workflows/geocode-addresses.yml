name: Geokoda utstationeringsadresser
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/geocode-addresses.yml'
      - 'geocode_addresses.py'
      - 'fallback_lulea_municipal_addresses.py'
      - 'fallback_boden_municipal_addresses.py'
      - 'promote_boden_municipal_addresses.py'
      - 'validate_geocoding.py'
      - 'diagnose_unresolved_addresses.py'
      - 'data/manual_coordinates.csv'
      - 'data/address_source_candidates.csv'
      - 'data/latest.csv'
      - 'data/history.csv'
  schedule:
    - cron: "30 8 * * 1"
permissions:
  contents: write
concurrency:
  group: geocode-utstationering
  cancel-in-progress: false
jobs:
  geocode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Geokoda nya adresser med hastighetsbegränsning
        run: python geocode_addresses.py
      - name: Granska kommunala adresskandidater som fallback
        run: python fallback_lulea_municipal_addresses.py
      - name: Granska Bodens kommunala adresskandidater
        run: python fallback_boden_municipal_addresses.py
      - name: Använd entydiga Bodenkandidater i kartan
        run: python promote_boden_municipal_addresses.py
      - name: Uppdatera listor efter godkända Bodenkandidater
        run: GEOCODE_LIMIT=0 python geocode_addresses.py
      - name: Validera JSON och adressmatchning
        run: python validate_geocoding.py
      - name: Analysera adresser som fortfarande saknar koordinater
        run: python diagnose_unresolved_addresses.py
      - name: Spara verifierade koordinater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # On concurrent writes, reload current main and recompute rather than rebasing
          # generated CSV/JSON outputs (which frequently causes merge conflicts).
          for attempt in 1 2 3; do
            git add data/geocoded_addresses.json data/geocoding_review.csv data/geocoding_quality_review.csv data/geocoding_attempts.json data/municipal_address_candidates.csv data/boden_municipal_address_candidates.csv data/unresolved_address_diagnostics.csv
            if git diff --cached --quiet; then
              echo "No geocoding changes to publish"
              exit 0
            fi
            git commit -m "Update geocoded address cache"
            if git push origin HEAD:main; then
              echo "Geocoding data published"
              exit 0
            fi
            echo "Remote main advanced; recomputing on latest main (attempt $attempt)"
            git fetch origin main
            git reset --hard origin/main
            python geocode_addresses.py
            python fallback_lulea_municipal_addresses.py
            python fallback_boden_municipal_addresses.py
            python promote_boden_municipal_addresses.py
            GEOCODE_LIMIT=0 python geocode_addresses.py
            python validate_geocoding.py
          done
          echo "Unable to publish after 3 attempts"
          exit 1
