name: Geokoda utstationeringsadresser
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/geocode-addresses.yml'
      - 'geocode_addresses.py'
  schedule:
    - cron: "30 8 * * 1"
permissions:
  contents: write
concurrency:
  group: geocode-utstationering
  cancel-in-progress: false
jobs:
  geocode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Geokoda nya adresser med hastighetsbegränsning
        run: python geocode_addresses.py
      - name: Spara verifierade koordinater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/geocoded_addresses.json data/geocoding_review.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update geocoded address cache"
          git pull --rebase origin main
          git push
