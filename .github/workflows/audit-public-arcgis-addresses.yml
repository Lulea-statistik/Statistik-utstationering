name: Auditera publika ArcGIS-adresslager
on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 1 * *"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kontrollera publika adresslagers metadata
        run: python audit_public_arcgis_addresses.py
      - name: Spara granskningsrapport
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public_arcgis_address_audit.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update public ArcGIS address layer audit"
          git pull --rebase origin main
          git push
