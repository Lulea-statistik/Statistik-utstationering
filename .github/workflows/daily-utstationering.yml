name: Daglig utstationering

on:
  workflow_dispatch:
  push:
    paths:
      - "scrape_utstationering.py"
      - ".github/workflows/daily-utstationering.yml"
  schedule:
    # GitHub cron använder UTC. Kör 04:15 UTC varje dag.
    # Det motsvarar 06:15 svensk sommartid och 05:15 svensk vintertid.
    - cron: "15 4 * * *"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checka ut repo
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installera paket
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Hämta Luleå och Boden
        run: python scrape_utstationering.py

      - name: Ladda upp debug vid fel
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: utstationering-debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit och push om data ändrats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Inga ändringar att committa."
            exit 0
          fi
          git commit -m "Daglig utstationering $(date -u +'%Y-%m-%d')"

          # Main may have advanced while the scrape was running.
          # Rebase the generated data commit onto the current remote main
          # before pushing, so a harmless concurrent commit does not cause
          # a non-fast-forward failure.
          git pull --rebase origin main
          git push
